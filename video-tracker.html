<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Video Tracker · Stan Media</title>
<meta name="description" content="Internal Stan Media tool: every client video episode and the stage it is at.">
<style>
/* ==========================================================================
   VIDEO TRACKER · Stan Media
   Internal, single-user tool. Liquid-glass UI.

   Every colour, radius, blur and duration is a --vt-* custom property on :root
   so the whole thing can be rethemed (or inherit the hub's tokens) without
   touching a single rule below. All classes are prefixed vt- so the file can
   drop into the Stan Media hub without collisions.
   ========================================================================== */

/* ----- 1. Tokens (light) ------------------------------------------------- */
:root {
  color-scheme: light;

  /* Canvas + mesh blobs */
  --vt-bg: #f3f4f9;
  --vt-blob-1: rgba(166, 196, 255, 0.95);   /* pale blue   */
  --vt-blob-2: rgba(214, 192, 255, 0.90);   /* lilac       */
  --vt-blob-3: rgba(255, 241, 226, 1.00);   /* warm white  */
  --vt-blob-4: rgba(186, 226, 255, 0.80);   /* sky         */
  --vt-blob-opacity: 0.85;

  /* Glass */
  --vt-glass: rgba(255, 255, 255, 0.62);
  --vt-glass-strong: rgba(255, 255, 255, 0.76);
  --vt-glass-soft: rgba(255, 255, 255, 0.42);
  --vt-glass-border: rgba(255, 255, 255, 0.82);
  --vt-glass-highlight: rgba(255, 255, 255, 0.95);
  --vt-glass-specular: rgba(255, 255, 255, 0.55);
  --vt-blur: 24px;
  --vt-blur-btn: 12px;
  --vt-blur-scrim: 3px;
  --vt-blur-mesh: 70px;
  --vt-saturate: 180%;
  --vt-scrim: rgba(20, 24, 50, 0.18);

  /* Ink */
  --vt-ink: #121424;
  --vt-ink-2: rgba(18, 20, 36, 0.64);
  --vt-ink-3: rgba(18, 20, 36, 0.60);
  --vt-hairline: rgba(18, 20, 36, 0.08);
  --vt-field: rgba(255, 255, 255, 0.55);

  /* Accents */
  --vt-accent: #5b78f0;
  --vt-accent-hi: #7b93f5;
  --vt-accent-ink: #ffffff;
  --vt-accent-soft: rgba(91, 120, 240, 0.14);
  --vt-accent-glow: rgba(91, 120, 240, 0.28);
  --vt-accent-glow-hi: rgba(91, 120, 240, 0.36);
  --vt-focus: #5b78f0;
  --vt-warn: #dc9f47;
  --vt-warn-soft: rgba(220, 159, 71, 0.16);
  --vt-danger: #de5a5f;
  --vt-danger-soft: rgba(222, 90, 95, 0.12);

  /* Shadows (layered, soft) */
  --vt-shadow-1: 0 1px 2px rgba(22, 26, 52, 0.04), 0 10px 30px rgba(22, 26, 52, 0.07);
  --vt-shadow-2: 0 2px 6px rgba(22, 26, 52, 0.06), 0 22px 56px rgba(22, 26, 52, 0.14);
  --vt-shadow-3: 0 8px 20px rgba(22, 26, 52, 0.10), 0 40px 90px rgba(22, 26, 52, 0.22);
  --vt-shadow-tint: rgba(22, 26, 52, 0.12);
  --vt-inset-tint: rgba(22, 26, 52, 0.05);

  /* Radii */
  --vt-r-xs: 10px;
  --vt-r-bar: 4px;
  --vt-r-sm: 12px;
  --vt-r-md: 16px;
  --vt-r-lg: 22px;
  --vt-r-xl: 28px;
  --vt-r-pill: 999px;

  /* Motion */
  --vt-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --vt-fast: 150ms;
  --vt-med: 220ms;
  --vt-slow: 340ms;

  /* Type: three sizes only */
  --vt-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, "Segoe UI", Roboto, system-ui, sans-serif;
  --vt-fs-h: 28px;
  --vt-fs-body: 14px;
  --vt-fs-small: 12px;

  /* Layout */
  --vt-gutter: clamp(16px, 3vw, 32px);
  --vt-max: 1320px;

  /* Stage palette: soft and desaturated, only ever used for dots, pills, fills */
  --vt-stage-1: #a6b4dc;   /* Scripted               */
  --vt-stage-2: #ada4de;   /* Script approved        */
  --vt-stage-3: #c9a8d6;   /* Sent to client         */
  --vt-stage-4: #9fc1dc;   /* Footage uploaded       */
  --vt-stage-5: #92c4bd;   /* Editing                */
  --vt-stage-6: #d8c494;   /* Waiting for approval   */
  --vt-stage-7: #9dcaa4;   /* Approved               */
  --vt-stage-8: #a8b1bb;   /* Feedback video recorded*/
  --vt-blocked: #e3a776;
}

/* ----- 1b. Tokens (dark) ------------------------------------------------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --vt-bg: #0e1017;
    --vt-blob-1: rgba(64, 92, 190, 0.55);
    --vt-blob-2: rgba(120, 88, 190, 0.50);
    --vt-blob-3: rgba(96, 82, 70, 0.45);
    --vt-blob-4: rgba(52, 110, 170, 0.45);
    --vt-blob-opacity: 0.75;
    --vt-glass: rgba(30, 33, 47, 0.58);
    --vt-glass-strong: rgba(36, 39, 55, 0.74);
    --vt-glass-soft: rgba(30, 33, 47, 0.38);
    --vt-glass-border: rgba(255, 255, 255, 0.10);
    --vt-glass-highlight: rgba(255, 255, 255, 0.14);
    --vt-glass-specular: rgba(255, 255, 255, 0.08);
    --vt-scrim: rgba(0, 0, 0, 0.45);
    --vt-ink: #eef0f7;
    --vt-ink-2: rgba(238, 240, 247, 0.66);
    --vt-ink-3: rgba(238, 240, 247, 0.62);
    --vt-hairline: rgba(255, 255, 255, 0.08);
    --vt-field: rgba(255, 255, 255, 0.06);
    --vt-accent: #7b93f5;
    --vt-accent-hi: #96aaf8;
    --vt-accent-ink: #0e1017;
    --vt-accent-soft: rgba(123, 147, 245, 0.18);
    --vt-accent-glow: rgba(123, 147, 245, 0.30);
    --vt-accent-glow-hi: rgba(123, 147, 245, 0.40);
    --vt-focus: rgba(150, 170, 248, 0.70);
    --vt-warn-soft: rgba(220, 159, 71, 0.22);
    --vt-danger-soft: rgba(222, 90, 95, 0.18);
    --vt-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.30), 0 10px 30px rgba(0, 0, 0, 0.35);
    --vt-shadow-2: 0 2px 6px rgba(0, 0, 0, 0.35), 0 22px 56px rgba(0, 0, 0, 0.45);
    --vt-shadow-3: 0 8px 20px rgba(0, 0, 0, 0.40), 0 40px 90px rgba(0, 0, 0, 0.55);
    --vt-shadow-tint: rgba(0, 0, 0, 0.35);
    --vt-inset-tint: rgba(0, 0, 0, 0.25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --vt-bg: #0e1017;
  --vt-blob-1: rgba(64, 92, 190, 0.55);
  --vt-blob-2: rgba(120, 88, 190, 0.50);
  --vt-blob-3: rgba(96, 82, 70, 0.45);
  --vt-blob-4: rgba(52, 110, 170, 0.45);
  --vt-blob-opacity: 0.75;
  --vt-glass: rgba(30, 33, 47, 0.58);
  --vt-glass-strong: rgba(36, 39, 55, 0.74);
  --vt-glass-soft: rgba(30, 33, 47, 0.38);
  --vt-glass-border: rgba(255, 255, 255, 0.10);
  --vt-glass-highlight: rgba(255, 255, 255, 0.14);
  --vt-glass-specular: rgba(255, 255, 255, 0.08);
  --vt-scrim: rgba(0, 0, 0, 0.45);
  --vt-ink: #eef0f7;
  --vt-ink-2: rgba(238, 240, 247, 0.66);
  --vt-ink-3: rgba(238, 240, 247, 0.62);
  --vt-hairline: rgba(255, 255, 255, 0.08);
  --vt-field: rgba(255, 255, 255, 0.06);
  --vt-accent: #7b93f5;
  --vt-accent-hi: #96aaf8;
  --vt-accent-ink: #0e1017;
  --vt-accent-soft: rgba(123, 147, 245, 0.18);
  --vt-accent-glow: rgba(123, 147, 245, 0.30);
  --vt-accent-glow-hi: rgba(123, 147, 245, 0.40);
  --vt-focus: rgba(150, 170, 248, 0.70);
  --vt-warn-soft: rgba(220, 159, 71, 0.22);
  --vt-danger-soft: rgba(222, 90, 95, 0.18);
  --vt-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.30), 0 10px 30px rgba(0, 0, 0, 0.35);
  --vt-shadow-2: 0 2px 6px rgba(0, 0, 0, 0.35), 0 22px 56px rgba(0, 0, 0, 0.45);
  --vt-shadow-3: 0 8px 20px rgba(0, 0, 0, 0.40), 0 40px 90px rgba(0, 0, 0, 0.55);
  --vt-shadow-tint: rgba(0, 0, 0, 0.35);
  --vt-inset-tint: rgba(0, 0, 0, 0.25);
}

/* ----- 2. Base ----------------------------------------------------------- */
/* Standalone page only. The hub owns its own body styles, so drop this one rule when merging. */
body { margin: 0; min-height: 100vh; background: var(--vt-bg); -webkit-text-size-adjust: 100%; }

/* Everything below is scoped to the tracker root (.vt) and the mesh. */
.vt, .vt *, .vt *::before, .vt *::after, .vt-mesh, .vt-mesh * { box-sizing: border-box; }
.vt {
  color: var(--vt-ink);
  font-family: var(--vt-font);
  font-size: var(--vt-fs-body);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.vt button, .vt input, .vt select, .vt textarea { font: inherit; color: inherit; }
.vt button { cursor: pointer; }
.vt h1, .vt h2, .vt h3, .vt p { margin: 0; }
.vt ul, .vt ol { list-style: none; margin: 0; padding: 0; }
.vt a { color: inherit; }
.vt :is(button, a, input, select, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--vt-focus);
  outline-offset: 2px;
}
/* Controls that carry their own focus treatment (glow, highlight) skip the ring. */
.vt .vt-search input:focus-visible, .vt .vt-field:focus-visible, .vt .vt-menu-item:focus-visible { outline: none; }
.vt-sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.vt [hidden], .vt-mesh[hidden] { display: none !important; }

/* ----- 3. Mesh background ------------------------------------------------ */
.vt-mesh {
  position: fixed; inset: 0; z-index: -1; overflow: hidden;
  background: var(--vt-bg);
  pointer-events: none;
}
.vt-blob {
  position: absolute; border-radius: 50%;
  filter: blur(var(--vt-blur-mesh));
  opacity: var(--vt-blob-opacity);
  will-change: transform;
  animation: vt-drift 46s ease-in-out infinite alternate;
}
.vt-blob-1 { width: 60vmax; height: 60vmax; left: -18vmax; top: -22vmax; background: radial-gradient(circle at 35% 35%, var(--vt-blob-1), transparent 68%); }
.vt-blob-2 { width: 56vmax; height: 56vmax; right: -20vmax; top: -8vmax; background: radial-gradient(circle at 50% 50%, var(--vt-blob-2), transparent 68%); animation-duration: 58s; animation-delay: -12s; }
.vt-blob-3 { width: 64vmax; height: 64vmax; left: 10vmax; bottom: -32vmax; background: radial-gradient(circle at 50% 40%, var(--vt-blob-3), transparent 68%); animation-duration: 52s; animation-delay: -25s; }
.vt-blob-4 { width: 44vmax; height: 44vmax; right: 6vmax; bottom: -18vmax; background: radial-gradient(circle at 50% 50%, var(--vt-blob-4), transparent 68%); animation-duration: 64s; animation-delay: -40s; }
@keyframes vt-drift {
  from { transform: translate3d(0, 0, 0) scale(1); }
  to   { transform: translate3d(9%, 7%, 0) scale(1.1); }
}

/* ----- 4. Glass primitive ------------------------------------------------ */
.vt-glass, .vt-glass-soft, .vt-glass-strong {
  position: relative;
  border: 1px solid var(--vt-glass-border);
  border-radius: var(--vt-r-lg);
  -webkit-backdrop-filter: blur(var(--vt-blur)) saturate(var(--vt-saturate));
  backdrop-filter: blur(var(--vt-blur)) saturate(var(--vt-saturate));
  box-shadow: var(--vt-shadow-1), inset 0 1px 0 0 var(--vt-glass-highlight);
  /* top-edge specular, painted as a background layer so it never overlays content */
  background: linear-gradient(180deg, var(--vt-glass-specular) 0%, rgba(255,255,255,0) 42%) no-repeat, var(--vt-glass);
}
.vt-glass-soft { background: linear-gradient(180deg, var(--vt-glass-specular) 0%, rgba(255,255,255,0) 42%) no-repeat, var(--vt-glass-soft); }
.vt-glass-strong { background: linear-gradient(180deg, var(--vt-glass-specular) 0%, rgba(255,255,255,0) 42%) no-repeat, var(--vt-glass-strong); }

/* ----- 5. App shell ------------------------------------------------------ */
.vt-app {
  max-width: var(--vt-max);
  margin: 0 auto;
  padding: 16px var(--vt-gutter) 96px;
  display: flex; flex-direction: column; gap: 18px;
}
.vt-topbar {
  position: sticky; top: 12px; z-index: 20;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 12px 10px 16px;
  border-radius: var(--vt-r-xl);
}
.vt-brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.vt-brand-mark {
  width: 30px; height: 30px; border-radius: var(--vt-r-xs); flex: none;
  background: linear-gradient(145deg, var(--vt-stage-1), var(--vt-stage-3) 55%, var(--vt-stage-5));
  box-shadow: inset 0 1px 0 var(--vt-glass-highlight), 0 4px 12px var(--vt-shadow-tint);
}
.vt-brand strong { display: block; font-weight: 600; letter-spacing: -0.01em; line-height: 1.1; }
.vt-brand span { display: block; color: var(--vt-ink-3); font-size: var(--vt-fs-small); line-height: 1.2; }
.vt-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.vt-seg {
  display: inline-flex; padding: 3px; gap: 2px;
  border-radius: var(--vt-r-pill);
  background: var(--vt-glass-soft);
  border: 1px solid var(--vt-glass-border);
  box-shadow: inset 0 1px 2px var(--vt-inset-tint);
}
.vt-seg button {
  height: 32px; padding: 0 16px; border: 0; border-radius: var(--vt-r-pill);
  background: transparent; color: var(--vt-ink-2); font-weight: 500;
  transition: background var(--vt-fast) var(--vt-ease), color var(--vt-fast), box-shadow var(--vt-fast);
}
.vt-seg button:hover { color: var(--vt-ink); }
.vt-seg button[aria-current="page"] {
  background: var(--vt-glass-strong); color: var(--vt-ink);
  box-shadow: var(--vt-shadow-1), inset 0 1px 0 var(--vt-glass-highlight);
}

/* Buttons */
.vt-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 36px; padding: 0 14px;
  border-radius: var(--vt-r-pill);
  border: 1px solid var(--vt-glass-border);
  background: var(--vt-glass);
  color: var(--vt-ink);
  font-weight: 500; line-height: 1; white-space: nowrap;
  box-shadow: var(--vt-shadow-1), inset 0 1px 0 var(--vt-glass-highlight);
  -webkit-backdrop-filter: blur(var(--vt-blur-btn)); backdrop-filter: blur(var(--vt-blur-btn));
  transition: transform var(--vt-fast) var(--vt-ease), box-shadow var(--vt-fast) var(--vt-ease), background var(--vt-fast), opacity var(--vt-fast);
}
.vt-btn:hover { transform: translateY(-1px); box-shadow: var(--vt-shadow-2), inset 0 1px 0 var(--vt-glass-highlight); }
.vt-btn:active { transform: translateY(0) scale(0.98); }
.vt-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: var(--vt-shadow-1); }
.vt-btn svg { width: 16px; height: 16px; flex: none; }
.vt-btn-primary {
  background: linear-gradient(180deg, var(--vt-accent-hi), var(--vt-accent));
  color: var(--vt-accent-ink); border-color: transparent;
  box-shadow: var(--vt-shadow-1), 0 10px 24px var(--vt-accent-glow), inset 0 1px 0 var(--vt-glass-highlight);
}
.vt-btn-primary:hover { box-shadow: var(--vt-shadow-2), 0 16px 36px var(--vt-accent-glow-hi), inset 0 1px 0 var(--vt-glass-highlight); }
.vt-btn-ghost { background: transparent; border-color: transparent; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; color: var(--vt-ink-2); }
.vt-btn-ghost:hover { background: var(--vt-accent-soft); color: var(--vt-ink); box-shadow: none; }
.vt-btn-danger { color: var(--vt-danger); }
.vt-btn-danger:hover { background: var(--vt-danger-soft); }
.vt-btn-icon { width: 36px; padding: 0; }
.vt-icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: var(--vt-r-pill);
  border: 0; background: transparent; color: var(--vt-ink-2);
  transition: background var(--vt-fast), color var(--vt-fast), transform var(--vt-fast) var(--vt-ease);
}
.vt-icon-btn:hover { background: var(--vt-accent-soft); color: var(--vt-ink); }
.vt-icon-btn:active { transform: scale(0.94); }
.vt-icon-btn svg { width: 16px; height: 16px; }
.vt-icon-btn[aria-disabled="true"] { opacity: 0.35; pointer-events: none; }

/* Toolbar: search, chips, stage filter */
.vt-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.vt-search {
  display: flex; align-items: center; gap: 8px;
  height: 38px; padding: 0 12px 0 14px; min-width: 220px; flex: 1 1 240px; max-width: 420px;
  border-radius: var(--vt-r-pill);
  color: var(--vt-ink-3);
  transition: box-shadow var(--vt-fast) var(--vt-ease);
}
.vt-search:focus-within { box-shadow: var(--vt-shadow-2), 0 0 0 3px var(--vt-accent-soft), inset 0 1px 0 var(--vt-glass-highlight); }
.vt-search svg { width: 16px; height: 16px; flex: none; }
.vt-search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--vt-ink); outline: none; height: 100%; }
.vt-search input::placeholder { color: var(--vt-ink-3); }
.vt-search input::-webkit-search-cancel-button { -webkit-appearance: none; }
.vt-chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.vt-chip {
  height: 32px; padding: 0 13px; border-radius: var(--vt-r-pill);
  border: 1px solid var(--vt-glass-border); background: var(--vt-glass-soft);
  color: var(--vt-ink-2); font-weight: 500; font-size: var(--vt-fs-small);
  display: inline-flex; align-items: center; gap: 7px;
  transition: background var(--vt-fast), color var(--vt-fast), transform var(--vt-fast) var(--vt-ease), box-shadow var(--vt-fast);
}
.vt-chip:hover { transform: translateY(-1px); background: var(--vt-glass); color: var(--vt-ink); }
.vt-chip[aria-pressed="true"] { background: var(--vt-ink); color: var(--vt-bg); border-color: transparent; box-shadow: var(--vt-shadow-1); }
.vt-chip .vt-count { font-size: var(--vt-fs-small); }
.vt-chip[aria-pressed="true"] .vt-count { color: inherit; background: color-mix(in srgb, currentColor 18%, transparent); }
.vt-chip > .vt-chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
.vt-select {
  position: relative; display: inline-flex; align-items: center;
  height: 36px; border-radius: var(--vt-r-pill); padding: 0 8px 0 2px;
}
.vt-select select {
  appearance: none; -webkit-appearance: none;
  height: 100%; border: 0; background: transparent; color: var(--vt-ink);
  padding: 0 24px 0 12px; font-weight: 500; font-size: var(--vt-fs-small); cursor: pointer; max-width: 220px;
}
.vt-select svg { position: absolute; right: 12px; width: 14px; height: 14px; pointer-events: none; color: var(--vt-ink-3); }

/* ----- 6. Overview ------------------------------------------------------- */
.vt-view { display: flex; flex-direction: column; gap: 18px; }
.vt-hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 10px 6px 0; flex-wrap: wrap; }
.vt-h1 { font-size: var(--vt-fs-h); font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
.vt-sub { color: var(--vt-ink-2); margin-top: 6px; }
.vt-hero-date { color: var(--vt-ink-3); font-size: var(--vt-fs-small); font-weight: 500; letter-spacing: .02em; text-transform: uppercase; }
.vt-filtered-note { font-size: var(--vt-fs-small); color: var(--vt-accent); font-weight: 500; }

.vt-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.vt-stat { padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 4px; min-height: 118px;
  transition: transform var(--vt-med) var(--vt-ease), box-shadow var(--vt-med) var(--vt-ease); }
.vt-stat:hover { transform: translateY(-2px); box-shadow: var(--vt-shadow-2), inset 0 1px 0 var(--vt-glass-highlight); }
.vt-stat-label { font-size: var(--vt-fs-small); font-weight: 500; color: var(--vt-ink-2); display: flex; align-items: center; gap: 7px; }
.vt-stat-num { font-size: var(--vt-fs-h); font-weight: 700; letter-spacing: -0.03em; line-height: 1; margin-top: 4px; }
.vt-stat-sub { font-size: var(--vt-fs-small); color: var(--vt-ink-3); margin-top: auto; }
.vt-bar { height: 4px; border-radius: var(--vt-r-bar); background: var(--vt-hairline); overflow: hidden; margin-top: 10px; }
.vt-bar > span { display: block; height: 100%; border-radius: var(--vt-r-bar); background: var(--c, var(--vt-accent)); width: 0; transition: width var(--vt-slow) var(--vt-ease); }

.vt-panel { padding: 6px 6px 8px; }
.vt-panel-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; }
.vt-panel-head h2 { font-size: var(--vt-fs-body); font-weight: 600; letter-spacing: -0.01em; min-width: 0; overflow-wrap: anywhere; }
.vt-panel-head .vt-muted { margin-left: auto; }
.vt-count { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 7px; border-radius: var(--vt-r-pill); background: var(--vt-hairline); color: var(--vt-ink-2); font-size: var(--vt-fs-small); font-weight: 600; }
.vt-muted { color: var(--vt-ink-3); font-size: var(--vt-fs-small); }
.vt-empty { padding: 22px 16px 26px; color: var(--vt-ink-3); text-align: center; font-size: var(--vt-fs-small); }

.vt-row {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;

.vt-toast .vt-btn { height: 30px; padding: 0 12px; }

<script>
(() => {
'use strict';

/* =============================================================================
   §1  DATA  ─ seed data + pipeline definition
   -----------------------------------------------------------------------------
   Everything below in this section is plain data. Change the seed clients and
   episodes freely; the app only reads them the very first time it runs (or
   after "Reset sample data"). Real data lives in localStorage via the data

   ============================================================================= */

const CONFIG = {
  ownerName: 'Stan',
  storageKey: 'stanmedia.video-tracker.v1',
  prefsKey: 'stanmedia.video-tracker.prefs.v1',
  deliveredWindowDays: 7,          // "Delivered this week" = approved within the last N days

/* The pipeline. Order matters: index = position in the flow.
   waitingOn drives the Overview ("Waiting on me" / "Waiting on clients").
   nextAction is the short hint shown in the attention list and the sheet.      */
const STAGES = [
  { id: 'scripted',          label: 'Scripted',                short: 'Scripted',      waitingOn: 'me',     nextAction: 'Approve the script' },
  { id: 'script_approved',   label: 'Script approved',         short: 'Approved ✓',    waitingOn: 'me',     nextAction: 'Send it to the client' },
  { id: 'sent_to_client',    label: 'Sent to client',          short: 'Sent',          waitingOn: 'client', nextAction: 'Waiting for footage' },
  { id: 'footage_uploaded',  label: 'Footage uploaded',        short: 'Footage in',    waitingOn: 'me',     nextAction: 'Start the edit' },
  { id: 'editing',           label: 'Editing',                 short: 'Editing',       waitingOn: 'me',     nextAction: 'Finish the edit' },
  { id: 'waiting_approval',  label: 'Waiting for approval',    short: 'Review',        waitingOn: 'me',     nextAction: 'Review the video' },
  { id: 'approved',          label: 'Approved',                short: 'Approved',      waitingOn: 'me',     nextAction: 'Record the feedback video' },

/* =============================================================================
   §2  STORAGE ADAPTER
   -----------------------------------------------------------------------------
   The only place that touches localStorage. Everything is wrapped in try/catch
   so private mode, quota errors or a blocked origin degrade to "in-memory only".
   To move to Supabase / the hub backend, replace load()/save() here (or swap
   the Data module in §3 wholesale); the UI never talks to storage directly for
   tracker data. The one exception is loadPrefs()/savePrefs(): theme and view
   preferences are per-browser UI state, so §13/§15 call those directly.
   ============================================================================= */
const Store = {
  load() {
    try { const raw = localStorage.getItem(CONFIG.storageKey); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  },
  save(db) {
    try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(db)); return true; }
    catch (e) { return false; }
  },
  loadPrefs() {
    try { const raw = localStorage.getItem(CONFIG.prefsKey); return raw ? JSON.parse(raw) : {}; }
    catch (e) { return {}; }
  },
  savePrefs(prefs) {
    try { localStorage.setItem(CONFIG.prefsKey, JSON.stringify(prefs)); return true; }
    catch (e) { return false; }
  },
};

/* =============================================================================
   §3  DATA LAYER
   -----------------------------------------------------------------------------
   Public API (the UI only ever calls these):
     getClients()                      → Client[]
     getClient(id)                     → Client | null
     addClient(name)                   → Client
     getEpisodes()                     → Episode[]  (copies, never live objects)
     getEpisode(id)                    → Episode | null
     findEpisode(clientName, number)   → Episode | null
     addEpisode({clientId, number, notes, stage, links})  → {ok, episode | error}
     updateEpisodeStage(id, stageId, opts)                → {ok, changed, episode | error}
     toggleFeedbackVideo(id)                              → {ok, changed, episode | error}
     updateEpisode(id, {title, notes, links})             → {ok, episode | error}
     setBlocked(id, reason | null)                        → {ok, episode | error}
     deleteEpisode(id)                                    → {ok, episode | error}
     restoreEpisode(snapshot)                             → {ok}   (undo)
     exportJSON() / previewImport(obj) / importJSON(obj) / resetToSeed()
     onChange(fn) → unsubscribe                           fn({type, episodeId})
     storageOk()                                          → boolean

   Episode shape:
     { id, clientId, number, title, stage, history: [{stage, at, via?, back?}],
       notes, links: {notion, drive, video}, blocked: {reason, at} | null,
       createdAt, updatedAt }   (all timestamps are epoch ms)
   ============================================================================= */
const DAY = 86400000;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = (o) => JSON.parse(JSON.stringify(o));
/* Links: keep http(s) only (a bare "notion.so/..." gets https:// added); anything else is dropped. */
function safeUrl(v) {
  const t = String(v || '').trim();
  if (!t) return '';
  if (/^https?:\/\//i.test(t)) return t;
  if (/^[a-z][a-z0-9+.-]*:/i.test(t)) return '';
  return `https://${t}`;
}
const slug = (s) => String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'client';

function buildSeed(now = Date.now()) {
  const at = (daysAgo) => Math.round(now - daysAgo * DAY);
  const episodes = SEED_EPISODES.map((e) => {
    const history = e.history.map(([stage, d]) => ({ stage, at: at(d) }));
    return {
      id: `ep_${e.clientId}_${e.number}`,
      clientId: e.clientId,
      number: e.number,
      title: e.title || '',
      stage: e.stage,
      history,
      notes: e.notes || '',
      links: { notion: '', drive: '', video: '', ...(e.links || {}) },
      blocked: e.blocked ? { reason: e.blocked.reason, at: at(e.blocked.daysAgo || 0) } : null,
      createdAt: history[0].at,
      updatedAt: history[history.length - 1].at,
    };
  });
  return { version: 1, clients: clone(SEED_CLIENTS), episodes };
}

/* Validates + repairs anything coming from storage or an import. Returns null
   if the shape is unusable. Skips episodes that cannot be repaired.            */
function normalizeDb(raw) {
  if (!raw || typeof raw !== 'object' || !Array.isArray(raw.clients) || !Array.isArray(raw.episodes)) return null;
  const now = Date.now();
  const clients = [];
  const seenClient = new Set();
  for (const c of raw.clients) {
    if (!c || typeof c !== 'object') continue;
    const name = String(c.name || '').trim();
    if (!name) continue;
    const id = String(c.id || slug(name));
    if (seenClient.has(id)) continue;
    seenClient.add(id);
    clients.push({ id, name });
  }
  const episodes = [];
  const seenEp = new Set(), seenNumber = new Set();
  let skipped = 0;
  for (const e of raw.episodes) {
    const ep = normalizeEpisode(e, seenClient, now);
    const key = ep && `${ep.clientId}:${ep.number}`;
    if (!ep || seenEp.has(ep.id) || seenNumber.has(key)) { skipped++; continue; }
    seenEp.add(ep.id); seenNumber.add(key);
    episodes.push(ep);
  }
  return { db: { version: 1, clients, episodes }, skipped };
}

function normalizeEpisode(raw, clientIds, now) {
  if (!raw || typeof raw !== 'object') return null;
  if (!isStageId(raw.stage)) return null;
  if (!clientIds.has(String(raw.clientId))) return null;
  if (raw.number == null || raw.number === '') return null;
  const number = Number(raw.number);
  if (!Number.isInteger(number) || number < 0) return null;
  const history = (Array.isArray(raw.history) ? raw.history : [])
    .filter((h) => h && isStageId(h.stage) && Number.isFinite(Number(h.at)))
    .map((h) => ({ stage: h.stage, at: Number(h.at), ...(h.via ? { via: String(h.via) } : {}), ...(h.back ? { back: true } : {}) }))
    .sort((a, b) => a.at - b.at);
  if (!history.length || history[history.length - 1].stage !== raw.stage) {
    history.push({ stage: raw.stage, at: Number(raw.updatedAt) || now });
  }
  const links = raw.links && typeof raw.links === 'object' ? raw.links : {};
  const blocked = raw.blocked && typeof raw.blocked === 'object' && raw.blocked.reason != null
    ? { reason: String(raw.blocked.reason), at: Number(raw.blocked.at) || now }
    : null;
  return {
    id: String(raw.id || uid()),
    clientId: String(raw.clientId),
    number,
    title: String(raw.title || ''),
    stage: raw.stage,
    history,
    notes: String(raw.notes || ''),
    links: { notion: safeUrl(links.notion), drive: safeUrl(links.drive), video: safeUrl(links.video) },
    blocked,
    createdAt: Number(raw.createdAt) || history[0].at,
    updatedAt: Number(raw.updatedAt) || history[history.length - 1].at,
  };
}

const Data = (() => {
  const loaded = normalizeDb(Store.load());
  let db = loaded ? loaded.db : buildSeed();
  let persistOk = Store.save(db);   // first save doubles as the storage probe
  const listeners = new Set();

  const persist = () => { persistOk = Store.save(db); };
  const emit = (evt) => { listeners.forEach((fn) => { try { fn(evt); } catch (e) { console.error(e); } }); };
  const find = (id) => db.episodes.find((e) => e.id === id) || null;
  const fail = (error) => ({ ok: false, error });

  function getClients() { return clone(db.clients); }
  function getClient(id) { const c = db.clients.find((x) => x.id === id); return c ? clone(c) : null; }
  function addClient(name) {
    const clean = String(name || '').trim();
    if (!clean) return null;
    const existing = db.clients.find((c) => c.name.toLowerCase() === clean.toLowerCase());
    if (existing) return clone(existing);
    let id = slug(clean), n = 2;
    while (db.clients.some((c) => c.id === id)) id = `${slug(clean)}-${n++}`;
    const client = { id, name: clean };
    db.clients.push(client);
    persist(); emit({ type: 'client:add', clientId: id });
    return clone(client);
  }

  function getEpisodes() { return clone(db.episodes); }
  function getEpisode(id) { const e = find(id); return e ? clone(e) : null; }
  function findEpisode(clientName, number) {
    const c = db.clients.find((x) => x.name.toLowerCase() === String(clientName).toLowerCase());
    if (!c) return null;
    const e = db.episodes.find((x) => x.clientId === c.id && x.number === Number(number));
    return e ? clone(e) : null;
  }

  function addEpisode({ clientId, number, notes = '', stage = 'scripted', links = {}, title = '' }) {
    if (!db.clients.some((c) => c.id === clientId)) return fail('Unknown client');
    if (number == null || number === '') return fail('Episode number is required');
    const n = Number(number);
    if (!Number.isInteger(n) || n < 0) return fail('Episode number must be a whole number');
    if (!isStageId(stage)) return fail('Unknown stage');
    if (stage === FINAL_STAGE) return fail('New episodes cannot start as feedback recorded');
    if (db.episodes.some((e) => e.clientId === clientId && e.number === n)) return fail('That client already has this episode number');
    const now = Date.now();
    const episode = {
      id: `ep_${uid()}`, clientId, number: n, title: String(title || ''), stage,
      history: [{ stage, at: now }],
      notes: String(notes || ''),
      links: { notion: safeUrl(links.notion), drive: safeUrl(links.drive), video: safeUrl(links.video) },
      blocked: null, createdAt: now, updatedAt: now,
    };
    db.episodes.push(episode);
    persist(); emit({ type: 'episode:add', episodeId: episode.id });
    return { ok: true, episode: clone(episode) };
  }

  /* Moves an episode to any stage except the final one. opts.via tags the
     history entry ('super-client-video' when it comes from the skill). A move
     to an earlier stage is tagged back:true so the timeline and the
     "delivered" count can tell a correction from a real step forward. */
  function updateEpisodeStage(id, stageId, opts = {}) {
    const ep = find(id);
    if (!ep) return fail('Episode not found');
    if (!isStageId(stageId)) return fail('Unknown stage');
    if (stageId === FINAL_STAGE && !opts._manualTick) return fail('Feedback video recorded is ticked manually only');
    if (ep.stage === stageId) return { ok: true, changed: false, episode: clone(ep) };
    const now = Number(opts.at) || Date.now();
    const back = STAGE_INDEX[stageId] < STAGE_INDEX[ep.stage];
    ep.stage = stageId;
    ep.history.push({ stage: stageId, at: now, ...(opts.via ? { via: String(opts.via) } : {}), ...(back ? { back: true } : {}) });
    ep.updatedAt = now;
    persist(); emit({ type: 'episode:stage', episodeId: id });
    return { ok: true, changed: true, episode: clone(ep) };
  }

  /* The manual tick for stage 8. On → final stage (only from Approved). Off → back to Approved. */
  function toggleFeedbackVideo(id) {
    const ep = find(id);
    if (!ep) return fail('Episode not found');
    if (ep.stage === FINAL_STAGE) return updateEpisodeStage(id, STAGE_BEFORE_FINAL);
    if (!canTickFeedback(ep.stage)) return fail('Approve the episode first, then tick the feedback video');
    return updateEpisodeStage(id, FINAL_STAGE, { _manualTick: true });
  }

  function updateEpisode(id, patch = {}) {
    const ep = find(id);
    if (!ep) return fail('Episode not found');
    if ('title' in patch) ep.title = String(patch.title || '');
    if ('notes' in patch) ep.notes = String(patch.notes || '');
    if (patch.links && typeof patch.links === 'object') {
      for (const k of ['notion', 'drive', 'video']) if (k in patch.links) ep.links[k] = safeUrl(patch.links[k]);
    }
    persist(); emit({ type: 'episode:meta', episodeId: id });
    return { ok: true, episode: clone(ep) };
  }

  function setBlocked(id, reason) {
    const ep = find(id);
    if (!ep) return fail('Episode not found');
    const now = Date.now();
    ep.blocked = reason == null || String(reason).trim() === '' ? null : { reason: String(reason).trim(), at: now };
    ep.updatedAt = now;
    persist(); emit({ type: 'episode:blocked', episodeId: id });
    return { ok: true, episode: clone(ep) };
  }

  function deleteEpisode(id) {
    const i = db.episodes.findIndex((e) => e.id === id);
    if (i < 0) return fail('Episode not found');
    const [removed] = db.episodes.splice(i, 1);
    persist(); emit({ type: 'episode:delete', episodeId: id });
    return { ok: true, episode: clone(removed) };
  }

  /* Puts a previously returned episode copy back exactly as it was (undo). */
  function restoreEpisode(snapshot) {
    const ep = normalizeEpisode(snapshot, new Set(db.clients.map((c) => c.id)), Date.now());
    if (!ep) return fail('Cannot restore');
    if (db.episodes.some((e) => e.id !== ep.id && e.clientId === ep.clientId && e.number === ep.number)) return fail('That client already has this episode number');
    const i = db.episodes.findIndex((e) => e.id === ep.id);
    if (i >= 0) db.episodes[i] = ep; else db.episodes.push(ep);
    persist(); emit({ type: 'episode:restore', episodeId: ep.id });
    return { ok: true, episode: clone(ep) };
  }

  function exportJSON() {
    return { app: 'stan-media-video-tracker', version: 1, exportedAt: new Date().toISOString(), clients: clone(db.clients), episodes: clone(db.episodes) };
  }
  /* Validates an import without applying it, so the UI can confirm first. */
  function previewImport(obj) {
    const r = normalizeDb(obj);
    return r ? { ok: true, clients: r.db.clients.length, episodes: r.db.episodes.length, skipped: r.skipped }
             : fail('That file is not a Video Tracker export');
  }
  function importJSON(obj) {
    const result = normalizeDb(obj);
    if (!result) return fail('That file is not a Video Tracker export');
    db = result.db;
    persist(); emit({ type: 'db:replace' });
    return { ok: true, skipped: result.skipped, clients: db.clients.length, episodes: db.episodes.length };
  }
  function resetToSeed() { db = buildSeed(); persist(); emit({ type: 'db:replace' }); return { ok: true }; }

  function onChange(fn) { listeners.add(fn); return () => listeners.delete(fn); }
  function storageOk() { return persistOk; }

  return { getClients, getClient, addClient, getEpisodes, getEpisode, findEpisode, addEpisode, updateEpisodeStage,
           toggleFeedbackVideo, updateEpisode, setBlocked, deleteEpisode, restoreEpisode, exportJSON, previewImport,
           importJSON, resetToSeed, onChange, storageOk };
})();

/* =============================================================================
   §4  SYNC PLACEHOLDER  ─ Super Client Video → tracker
   -----------------------------------------------------------------------------
   The Super Client Video skill will push stage updates here once the tracker
   lives in the hub. Call it with the tracker's episode id (or resolve one with
   Data.findEpisode(clientName, number)) and a stage id from STAGES:

     skill phase                                  → newStage
     script posted for Stan's approval            → 'scripted'
     Stan approves the script in chat             → 'script_approved'
     email + WhatsApp sent to the client          → 'sent_to_client'
     footage watcher: upload finished             → 'footage_uploaded'
     edit procedure started / job folder prepped  → 'editing'
     video uploaded to "waiting for approval"     → 'waiting_approval'
     Stan approves the finished video             → 'approved'

   'feedback_recorded' is deliberately rejected: only Stan ticks that, by hand.
   TODO when wiring up: accept the hub's payload shape, and when the episode is
   missing create it via Data.addEpisode so a brand-new episode shows up here.
   ============================================================================= */
function syncFromSuperClientVideo(episodeId, newStage) {
  if (newStage === FINAL_STAGE) return { ok: false, error: 'feedback_recorded is ticked manually only' };
  return Data.updateEpisodeStage(episodeId, newStage, { via: 'super-client-video' });
}

const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const reducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const stageOf = (ep) => STAGES[STAGE_INDEX[ep.stage]];
const stageColor = (stageId) => `var(--vt-stage-${STAGE_INDEX[stageId] + 1})`;
const stageEnteredAt = (ep) => { for (let i = ep.history.length - 1; i >= 0; i--) if (ep.history[i].stage === ep.stage) return ep.history[i].at; return ep.updatedAt; };
const lastChangeAt = (ep) => Math.max(ep.history[ep.history.length - 1]?.at || 0, ep.blocked?.at || 0, ep.createdAt || 0);
const startOfDay = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
/* Calendar days, not 24h buckets: something changed at 18:00 yesterday is "1 day" at 09:00 today. */
const daysSince = (ts) => Math.max(0, Math.round((startOfDay(Date.now()) - startOfDay(ts)) / DAY));
const progressPct = (ep) => Math.round((STAGE_INDEX[ep.stage] / (STAGES.length - 1)) * 100);
const epName = (ep, client) => `${client ? client.name : 'Unknown'} · Ep ${ep.number}`;

function fmtDays(n, { suffix = '' } = {}) {
  if (n === 0) return 'Today';
  if (n === 1) return `1 day${suffix}`;
  return `${n} days${suffix}`;
}
function fmtDaysShort(n) { return n === 0 ? 'Today' : `${n}d`; }
function fmtDate(ts) {
  const d = new Date(ts), now = new Date();
  const opts = { day: 'numeric', month: 'short' };
  if (d.getFullYear() !== now.getFullYear()) opts.year = 'numeric';
  return d.toLocaleDateString(undefined, opts);
}
function fmtDateTime(ts) {
  const d = new Date(ts);
  return `${fmtDate(ts)}, ${d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}`;
}
function fmtRelative(ts) {
  const n = daysSince(ts);
  if (n === 0) return 'today';
  if (n === 1) return 'yesterday';
  return `${n} days ago`;
}
function greeting() {
  const h = new Date().getHours();
  const word = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  return `${word}, ${CONFIG.ownerName}.`;
}

/* Episodes joined with their client, after search + filters. */
function visibleEpisodes() {
  const clients = Object.fromEntries(Data.getClients().map((c) => [c.id, c]));
  const q = ui.search.trim().toLowerCase();
  return Data.getEpisodes()
    .map((ep) => ({ ep, client: clients[ep.clientId] || { id: ep.clientId, name: 'Unknown client' } }))
    .filter(({ ep, client }) => {
      if (ui.clientFilter !== 'all' && ep.clientId !== ui.clientFilter) return false;
      if (ui.stageFilter === 'blocked') { if (!ep.blocked) return false; }
      else if (ui.stageFilter !== 'all' && ep.stage !== ui.stageFilter) return false;
      if (!q) return true;
      const hay = [client.name, `ep ${ep.number}`, `episode ${ep.number}`, ep.title, ep.notes, stageOf(ep).label, ep.blocked?.reason || ''].join(' ').toLowerCase();
      return q.split(/\s+/).every((word) => hay.includes(word));
    });
}
const filtersActive = () => ui.search.trim() !== '' || ui.clientFilter !== 'all' || ui.stageFilter !== 'all';
const needsMe = (ep) => ep.stage !== FINAL_STAGE && (stageOf(ep).waitingOn === 'me' || !!ep.blocked);

/* Client chips re-render whenever clients or the filter change. */
function renderClientChips() {
  const el = $('#vt-client-chips', ui.root);
  const clients = Data.getClients();
  const counts = {};
  for (const ep of Data.getEpisodes()) counts[ep.clientId] = (counts[ep.clientId] || 0) + 1;
  const chip = (id, label, count) => `
    <button type="button" class="vt-chip" data-client="${esc(id)}" aria-pressed="${ui.clientFilter === id}">
      <span class="vt-chip-name">${esc(label)}</span>${count != null ? `<span class="vt-count">${count}<span class="vt-sr"> episodes</span></span>` : ''}
    </button>`;
  el.innerHTML = chip('all', 'All clients') + clients.map((c) => chip(c.id, c.name, counts[c.id] || 0)).join('');

  const since = Date.now() - CONFIG.deliveredWindowDays * DAY;

  // Backward corrections (un-ticking, moving back to Approved) are tagged back:true and don't count.
