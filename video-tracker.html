/* =============================================================================
   §8  RENDER: PIPELINE BOARD (+ FLIP animation between renders)
   ============================================================================= */
function captureBoardRects(view) {
  const map = new Map();
  $$('.vt-card-wrap[data-id]', view).forEach((el) => {
    map.set(el.dataset.id, { rect: el.getBoundingClientRect(), stage: el.dataset.stage });
  });
  const wrap = $('.vt-board-wrap', view);
  return { map, scrollLeft: wrap ? wrap.scrollLeft : 0, hadBoard: !!wrap };
}

function renderBoard(view) {
  const before = captureBoardRects(view);
  const items = visibleEpisodes();
  const stages = ui.stageFilter !== 'all' && ui.stageFilter !== 'blocked' ? STAGES.filter((s) => s.id === ui.stageFilter) : STAGES;
  const firstRender = ui.lastRenderedView !== 'board';

  const columns = stages.map((s) => {
    const eps = items.filter((x) => x.ep.stage === s.id).sort((a, b) => stageEnteredAt(a.ep) - stageEnteredAt(b.ep));
    const cards = eps.map(({ ep, client }, i) => {
      const isNew = firstRender || !before.map.has(ep.id);
      const days = daysSince(stageEnteredAt(ep));
      const label = `${client.name} episode ${ep.number}`;
      return `
        <li class="vt-card-wrap ${isNew ? 'vt-enter' : ''}" style="--i:${i}" data-id="${esc(ep.id)}" data-stage="${esc(ep.stage)}" draggable="true">
          <article class="vt-card vt-glass" style="--c:${stageColor(ep.stage)}" data-card="${esc(ep.id)}">
            <div class="vt-card-main">
              <button type="button" class="vt-card-open" data-open="${esc(ep.id)}" aria-label="Open ${esc(label)}, ${esc(s.label)}, ${esc(fmtDays(days, { suffix: ' in stage' }))}${ep.blocked ? ', blocked' : ''}">
                <span class="vt-card-client">${esc(client.name)}</span>
                <span class="vt-card-ep">Ep ${ep.number}${ep.title ? `<small>${esc(ep.title)}</small>` : ''}</span>
              </button>
              <span class="vt-card-meta">
                <span>${esc(days === 0 ? 'Moved today' : fmtDays(days, { suffix: ' in stage' }))}</span>
                ${ep.blocked ? `<span class="vt-pill vt-pill-blocked" title="${esc(ep.blocked.reason)}">${ICONS.flag}Blocked</span>` : ''}
              </span>
            </div>
            <button type="button" class="vt-icon-btn vt-card-menu" data-menu="${esc(ep.id)}" aria-haspopup="menu" aria-expanded="false" aria-label="Move ${esc(label)} to another stage">${ICONS.more}</button>
            <span class="vt-card-bar" aria-hidden="true"><span data-width="${progressPct(ep)}%"></span></span>
          </article>
        </li>`;
    }).join('');
    return `
      <section class="vt-col vt-glass-soft ${eps.length ? '' : 'is-empty'}" data-stage="${esc(s.id)}" aria-labelledby="vt-col-${esc(s.id)}">
        <header class="vt-col-head">
          <span class="vt-dot" style="--c:${stageColor(s.id)}"></span>
          <h2 id="vt-col-${esc(s.id)}" title="${esc(s.label)}">${esc(s.label)}</h2>
          <span class="vt-count">${eps.length}<span class="vt-sr"> episodes</span></span>
        </header>
        <ul class="vt-col-body" role="list">${cards}</ul>
        <div class="vt-col-hint" aria-hidden="true">${s.id === FINAL_STAGE ? 'Drop an approved episode to tick it' : 'Drop here'}</div>
      </section>`;
  }).join('');

  view.innerHTML = `
    <h1 class="vt-sr">Pipeline</h1>
    <p class="vt-board-hint">Drag cards between stages, or use the ⋯ menu on a card to move it. ${filtersActive() ? '<span class="vt-filtered-note">Filtered.</span>' : ''}</p>
    <div class="vt-board-wrap"><div class="vt-board ${stages.length === 1 ? 'is-single' : ''}" role="region" aria-label="Pipeline board">${columns}</div></div>`;

  const wrap = $('.vt-board-wrap', view);
  if (before.hadBoard) wrap.scrollLeft = before.scrollLeft;

  // Progress fills: start from the previous width (if the card existed) and ease to the new one.
  $$('.vt-card-wrap', view).forEach((el) => {
    const bar = $('.vt-card-bar > span', el);
    const prev = before.map.get(el.dataset.id);
    if (prev && isStageId(prev.stage)) bar.style.width = `${Math.round((STAGE_INDEX[prev.stage] / (STAGES.length - 1)) * 100)}%`;
  });
  requestAnimationFrame(() => $$('.vt-card-bar > span[data-width]', view).forEach((b) => { b.style.width = b.dataset.width; }));

  if (!reducedMotion() && before.map.size) playFlip(view, before.map);
}

/* FLIP: cards that existed before glide from their old position to the new one. */
function playFlip(view, beforeMap) {
  const moving = [];
  $$('.vt-card-wrap[data-id]', view).forEach((el) => {
    const prev = beforeMap.get(el.dataset.id);
    if (!prev) return;
    const now = el.getBoundingClientRect();
    const dx = prev.rect.left - now.left, dy = prev.rect.top - now.top;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
    el.style.transform = `translate(${dx}px, ${dy}px)`;
    el.style.transition = 'none';
    moving.push(el);
  });
  if (!moving.length) return;
  requestAnimationFrame(() => {
    moving.forEach((el) => {
      el.classList.add('vt-flip');
      el.style.transition = '';
      el.style.transform = '';
      el.addEventListener('transitionend', () => el.classList.remove('vt-flip'), { once: true });
    });
  });
}

/* ---------- Drag & drop (HTML5 DnD; the ⋯ menu is the keyboard/touch path) ---------- */
function bindDragAndDrop(view) {
  view.addEventListener('dragstart', (e) => {
    const node = e.target instanceof Element ? e.target : e.target.parentElement;   // Firefox: text-selection drags
    const card = node && node.closest('.vt-card-wrap[draggable="true"]');
    if (!card) return;
    ui.dragId = card.dataset.id;
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', card.dataset.id); } catch (err) { /* older browsers */ }
    requestAnimationFrame(() => card.classList.add('is-dragging'));
  });
  view.addEventListener('dragend', () => {
    // A drop onto a forbidden column never fires 'drop' (dropEffect was 'none'), so explain it here.
    if (ui.dragId && ui.dragOverForbidden) toast('Approve the episode first, then tick the feedback video', { kind: 'warn' });
    ui.dragId = null; ui.dragOverForbidden = false;
    $$('.vt-card-wrap.is-dragging', view).forEach((c) => c.classList.remove('is-dragging'));
    $$('.vt-col.is-over', view).forEach((c) => c.classList.remove('is-over', 'is-forbidden'));
  });
  view.addEventListener('dragover', (e) => {
    const col = e.target.closest('.vt-col');
    if (!col || !ui.dragId) return;
    e.preventDefault();
    const allowed = dropAllowed(ui.dragId, col.dataset.stage);
    e.dataTransfer.dropEffect = allowed ? 'move' : 'none';
    $$('.vt-col.is-over', view).forEach((c) => { if (c !== col) c.classList.remove('is-over', 'is-forbidden'); });
    col.classList.add('is-over');
    col.classList.toggle('is-forbidden', !allowed);
    ui.dragOverForbidden = !allowed;
  });
  view.addEventListener('dragleave', (e) => {
    const col = e.target.closest('.vt-col');
    if (col && !col.contains(e.relatedTarget)) { col.classList.remove('is-over', 'is-forbidden'); ui.dragOverForbidden = false; }
  });
  view.addEventListener('drop', (e) => {
    const col = e.target.closest('.vt-col');
    if (!col) return;
    e.preventDefault();
    let id = ui.dragId;
    try { id = id || e.dataTransfer.getData('text/plain'); } catch (err) { /* ignore */ }
    col.classList.remove('is-over', 'is-forbidden');
    ui.dragId = null; ui.dragOverForbidden = false;
    if (id) moveEpisode(id, col.dataset.stage);
  });
}

function dropAllowed(episodeId, stageId) {
  const ep = Data.getEpisode(episodeId);
  if (!ep) return false;
  if (stageId === FINAL_STAGE) return canTickFeedback(ep.stage);
  return true;
}

/* One entry point for every stage move (drag, menu, sheet buttons). Shows a toast with Undo. */
function moveEpisode(id, stageId) {
  const before = Data.getEpisode(id);
  if (!before) return;
  const client = Data.getClient(before.clientId);
  let res;
  if (stageId === FINAL_STAGE) {
    if (before.stage === FINAL_STAGE) return;
    res = Data.toggleFeedbackVideo(id);
  } else {
    res = Data.updateEpisodeStage(id, stageId);
  }
  if (!res.ok) { toast(res.error, { kind: 'warn' }); return; }
  if (!res.changed) return;
  toast(`${epName(before, client)} → ${STAGES[STAGE_INDEX[stageId]].label}`, {
    action: { label: 'Undo', onClick: () => { if (Data.getEpisode(id)) Data.restoreEpisode(before); } },
  });
}

/* =============================================================================
   §9  RENDER: EPISODE DETAIL SHEET
   ============================================================================= */
function openSheet(id) {
  const ep = Data.getEpisode(id);
  if (!ep) return;
  if (ui.openEpisodeId && ui.openEpisodeId !== id) flushSheetEdits();
  const wasOpen = !!ui.openEpisodeId;
  ui.openEpisodeId = id;
  // Remember where to send focus back by key, since the view re-renders while the sheet is open.
  if (!wasOpen) {
    const a = document.activeElement;
    ui.returnFocus = a && a.hasAttribute && a.hasAttribute('data-open') ? { attr: 'data-open', value: a.getAttribute('data-open') } : a;
  }
  const sheet = $('#vt-sheet', ui.root), scrim = $('#vt-scrim', ui.root);
  renderSheet();
  sheet.hidden = false; scrim.hidden = false;
  const app = $('.vt-app', ui.root); if (app) app.inert = true;   // everything behind the sheet is out of reach
  requestAnimationFrame(() => { sheet.classList.add('is-open'); scrim.classList.add('is-open'); });
  document.body.style.overflow = 'hidden';
  setTimeout(() => { const first = $('[data-close]', sheet); if (first && ui.openEpisodeId === id) first.focus(); }, reducedMotion() ? 0 : 60);
}

function closeSheet() {
  if (!ui.openEpisodeId) return;
  flushSheetEdits();
  const sheet = $('#vt-sheet', ui.root), scrim = $('#vt-scrim', ui.root);
  ui.openEpisodeId = null;
  sheet.classList.remove('is-open'); scrim.classList.remove('is-open');
  document.body.style.overflow = '';
  const app = $('.vt-app', ui.root); if (app) app.inert = false;
  const done = () => { if (!ui.openEpisodeId) { sheet.hidden = true; scrim.hidden = true; sheet.innerHTML = ''; delete sheet.dataset.episodeId; } };
  if (reducedMotion()) done(); else setTimeout(done, 360);
  const view = $('#vt-view', ui.root);
  let target = null;
  if (ui.returnFocus && ui.returnFocus.attr) target = view.querySelector(`[${ui.returnFocus.attr}="${CSS.escape(ui.returnFocus.value)}"]`);
  else if (ui.returnFocus && document.contains(ui.returnFocus)) target = ui.returnFocus;
  (target || view).focus({ preventScroll: true });
  ui.returnFocus = null;
}

/* Notes and links are saved on a short debounce; this commits anything still pending so
   closing the sheet, re-rendering it or switching episode never drops the last keystrokes. */
let sheetSaveTimer = null;
function flushSheetEdits() {
  clearTimeout(sheetSaveTimer); sheetSaveTimer = null;
  const sheet = $('#vt-sheet', ui.root);
  const id = ui.openEpisodeId;
  if (!sheet || !id || sheet.dataset.episodeId !== id) return;
  const ep = Data.getEpisode(id);
  if (!ep) return;
  const patch = {};
  const notes = $('[data-field="notes"]', sheet);
  if (notes && notes.value !== ep.notes) patch.notes = notes.value;
  const links = {};
  $$('[data-link]', sheet).forEach((input) => { if (input.value.trim() !== ep.links[input.dataset.link]) links[input.dataset.link] = input.value; });
  if (Object.keys(links).length) patch.links = links;
  if (Object.keys(patch).length) Data.updateEpisode(id, patch);
}

function renderSheet() {
  const sheet = $('#vt-sheet', ui.root);
  flushSheetEdits();
  const ep = ui.openEpisodeId && Data.getEpisode(ui.openEpisodeId);
  if (!ep) { closeSheet(); return; }
  const client = Data.getClient(ep.clientId) || { name: 'Unknown client' };
  const idx = STAGE_INDEX[ep.stage];
  const s = STAGES[idx];
  const isFinal = ep.stage === FINAL_STAGE;
  const canTick = canTickFeedback(ep.stage);
  const days = daysSince(stageEnteredAt(ep));
  // Timeline timestamps: the last genuine (forward) entry for a stage; a backward correction keeps the original date.
  const lastEnteredAt = (stageId) => {
    let any = null;
    for (let i = ep.history.length - 1; i >= 0; i--) {
      const h = ep.history[i];
      if (h.stage !== stageId) continue;
      if (!h.back) return h;
      if (!any) any = h;
    }
    return any;
  };
  // Keep keyboard focus on the same control across the rebuild.
  const active = document.activeElement;
  let focusSel = null;
  if (active && sheet.contains(active)) {
    for (const attr of ['data-act', 'data-menu', 'data-link', 'data-field', 'data-close']) {
      if (active.hasAttribute(attr)) { focusSel = `[${attr}="${CSS.escape(active.getAttribute(attr))}"]`; break; }
    }
    if (!focusSel && active.closest('[data-form="block"]')) focusSel = '[data-act="unblock"], [data-form="block"] [name="reason"]';
  }

  const timeline = STAGES.map((st, i) => {
    const entry = lastEnteredAt(st.id);
    const state = i < idx ? 'is-done' : i === idx ? 'is-current' : 'is-upcoming';
    let time = '';
    if (i <= idx && entry) time = fmtDateTime(entry.at) + (entry.via ? ' <em>· synced</em>' : '');
    else if (entry) time = `<em>earlier: ${esc(fmtDate(entry.at))}</em>`;
    return `
      <li class="vt-tl ${state}" style="--c:${stageColor(st.id)}" ${i === idx ? 'aria-current="step"' : ''}>
        <span class="vt-tl-dot" aria-hidden="true"></span>
        <div class="vt-tl-main">
          <span class="vt-tl-label">${esc(st.label)}</span>
          <span class="vt-tl-time">${time || '<em>—</em>'}</span>
        </div>
      </li>`;
  }).join('');

  const linkRow = (key, label, placeholder) => `
    <div class="vt-link">
      <label><span class="vt-label">${esc(label)}</span>
        <input class="vt-field" type="url" inputmode="url" data-link="${key}" value="${esc(ep.links[key])}" placeholder="${esc(placeholder)}" spellcheck="false">
      </label>
      <a class="vt-icon-btn" href="${ep.links[key] ? esc(ep.links[key]) : '#'}" target="_blank" rel="noopener noreferrer" aria-label="Open ${esc(label)}" ${ep.links[key] ? '' : 'aria-disabled="true" tabindex="-1"'}>${ICONS.out}</a>
    </div>`;

  sheet.innerHTML = `
    <div class="vt-sheet-head">
      <div style="flex:1;min-width:0">
        <span class="vt-eyebrow">${esc(client.name)}</span>
        <h2 id="vt-sheet-title">Episode ${ep.number}${ep.title ? ` <span class="vt-muted" style="font-size:var(--vt-fs-body);font-weight:500">${esc(ep.title)}</span>` : ''}</h2>
      </div>
      <button type="button" class="vt-icon-btn" data-close aria-label="Close episode details">${ICONS.close}</button>
    </div>
    <div class="vt-sheet-body">
      <div class="vt-stage-now" style="--c:${stageColor(ep.stage)}">
        <span class="vt-dot"></span>
        <strong>${esc(s.label)}</strong>
        <span class="vt-muted">${esc(days === 0 ? 'moved today' : fmtDays(days, { suffix: ' in stage' }))} · ${esc(s.nextAction)}</span>
      </div>

      <div class="vt-sheet-actions">
        <button type="button" class="vt-btn" data-act="back" ${idx === 0 || isFinal ? 'disabled' : ''} aria-label="Move back to ${idx > 0 ? esc(STAGES[idx - 1].label) : 'previous stage'}">${ICONS.back}Back</button>
        <button type="button" class="vt-btn vt-btn-primary" data-act="forward" ${idx >= STAGES.length - 2 ? 'disabled' : ''} aria-label="Move forward to ${idx < STAGES.length - 2 ? esc(STAGES[idx + 1].label) : 'next stage'}">Forward${ICONS.fwd}</button>
        <button type="button" class="vt-btn" data-menu="${esc(ep.id)}" aria-haspopup="menu" aria-expanded="false">Move to…${ICONS.down}</button>
      </div>

      <label class="vt-tick ${canTick ? '' : 'is-disabled'}" title="${canTick ? '' : 'Approve the episode first'}">
        <input type="checkbox" data-act="tick" ${isFinal ? 'checked' : ''} ${canTick ? '' : 'disabled'} aria-describedby="vt-tick-help">
        <span><b>Feedback video recorded</b><small id="vt-tick-help">Ticked by you, by hand. Nothing ever sets this automatically.${canTick ? '' : ' Available once the episode is approved.'}</small></span>
      </label>

      <div class="vt-block-box ${ep.blocked ? 'is-blocked' : ''}">
        ${ep.blocked ? `
          <div class="vt-block-head"><span class="vt-pill vt-pill-blocked">${ICONS.flag}Blocked</span><b>Needs attention</b><span class="vt-muted">${esc(fmtRelative(ep.blocked.at))}</span></div>
          <div class="vt-block-reason">${esc(ep.blocked.reason)}</div>
          <div><button type="button" class="vt-btn" data-act="unblock">Clear flag</button></div>
        ` : `
          <div class="vt-block-head"><b>Blocked / needs attention</b><span class="vt-muted">Not flagged</span></div>
          <form class="vt-block-form" data-form="block">
            <input class="vt-field" name="reason" placeholder="Why is it stuck? (short reason)" aria-label="Reason for blocking" maxlength="140" required>
            <button type="submit" class="vt-btn">${ICONS.flag}Flag</button>
          </form>
        `}
      </div>

      <section aria-labelledby="vt-tl-title">
        <h3 id="vt-tl-title">Timeline</h3>
        <ol class="vt-timeline">${timeline}</ol>
      </section>

      <section>
        <h3><label for="vt-notes">Notes</label></h3>
        <textarea class="vt-field" id="vt-notes" data-field="notes" placeholder="Anything worth remembering about this episode">${esc(ep.notes)}</textarea>
      </section>

      <section aria-label="Links">
        <h3>Links</h3>
        <div class="vt-links">
          ${linkRow('notion', 'Notion page', 'https://www.notion.so/…')}
          ${linkRow('drive', 'Drive folder', 'https://drive.google.com/…')}
          ${linkRow('video', 'Finished video', 'https://…')}
        </div>
      </section>

      <div class="vt-sheet-foot">
        <span class="vt-muted">Added ${esc(fmtDate(ep.createdAt))}</span>
        <button type="button" class="vt-btn vt-btn-ghost vt-btn-danger" data-act="delete">Delete episode</button>
      </div>
    </div>`;
  sheet.dataset.episodeId = ep.id;
  if (focusSel) { const next = sheet.querySelector(focusSel); if (next) next.focus({ preventScroll: true }); else $('[data-close]', sheet).focus(); }
}

function bindSheet() {
  const sheet = $('#vt-sheet', ui.root);
  $('#vt-scrim', ui.root).addEventListener('click', closeSheet);

  sheet.addEventListener('click', (e) => {
    const id = ui.openEpisodeId;
    if (!id) return;
    if (e.target.closest('[data-close]')) { closeSheet(); return; }
    const menuBtn = e.target.closest('[data-menu]');
    if (menuBtn) { openMoveMenu(id, menuBtn); return; }
    const act = e.target.closest('[data-act]');
    if (!act) return;
    const ep = Data.getEpisode(id);
    if (!ep) return;
    const idx = STAGE_INDEX[ep.stage];
    switch (act.dataset.act) {
      case 'back': if (idx > 0) moveEpisode(id, STAGES[idx - 1].id); break;
      case 'forward': if (idx < STAGES.length - 2) moveEpisode(id, STAGES[idx + 1].id); break;
      case 'unblock': Data.setBlocked(id, null); toast('Flag cleared'); break;
      case 'delete':
        confirmDialog({ title: 'Delete this episode?', body: `${epName(ep, Data.getClient(ep.clientId))} and its history will be removed. You can undo straight away from the toast.`, okLabel: 'Delete', danger: true })
          .then((ok) => {
            if (!ok) return;
            const snapshot = Data.getEpisode(id);
            const res = Data.deleteEpisode(id);
            if (res.ok) { closeSheet(); toast(`Deleted ${epName(snapshot, Data.getClient(snapshot.clientId))}`, { action: { label: 'Undo', onClick: () => Data.restoreEpisode(snapshot) } }); }
          });
        break;
    }
  });

  sheet.addEventListener('change', (e) => {
    const id = ui.openEpisodeId;
    if (!id) return;
    if (e.target.matches('[data-act="tick"]')) {
      const res = Data.toggleFeedbackVideo(id);
      if (!res.ok) { toast(res.error, { kind: 'warn' }); renderSheet(); }
      else toast(res.episode.stage === FINAL_STAGE ? 'Feedback video ticked. Episode done.' : 'Feedback video unticked');
      return;
    }
    if (e.target.matches('[data-link]')) {
      const key = e.target.dataset.link;
      const typed = e.target.value.trim();
      const res = Data.updateEpisode(id, { links: { [key]: typed } });
      const v = res.ok ? res.episode.links[key] : '';
      if (typed && !v) toast('Only http(s) links are kept', { kind: 'warn' });
      e.target.value = v;
      const a = e.target.closest('.vt-link').querySelector('a');
      a.href = v || '#';
      if (v) { a.removeAttribute('aria-disabled'); a.removeAttribute('tabindex'); } else { a.setAttribute('aria-disabled', 'true'); a.setAttribute('tabindex', '-1'); }
    }
  });

  sheet.addEventListener('input', (e) => {
    if (!e.target.matches('[data-field="notes"]')) return;
    clearTimeout(sheetSaveTimer);
    sheetSaveTimer = setTimeout(flushSheetEdits, 350);
  });

  sheet.addEventListener('submit', (e) => {
    if (!e.target.matches('[data-form="block"]')) return;
    e.preventDefault();
    const reason = e.target.elements.reason.value.trim();
    if (!reason) return;
    Data.setBlocked(ui.openEpisodeId, reason);
    toast('Flagged as blocked');
  });

  sheet.addEventListener('click', (e) => {
    const a = e.target.closest('a[aria-disabled="true"]');
    if (a) e.preventDefault();
  });

  // Keyboard: Escape closes, Tab stays inside the sheet.
  sheet.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.stopPropagation(); closeSheet(); return; }
    if (e.key !== 'Tab') return;
    const focusables = $$('button:not([disabled]), input:not([disabled]), textarea, select, a[href]:not([tabindex="-1"])', sheet).filter((el) => el.offsetParent !== null);
    if (!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
}

/* =============================================================================
   §10  "MOVE TO…" MENU (keyboard + touch alternative to drag and drop)
   ============================================================================= */
function openMoveMenu(episodeId, anchor) {
  const ep = Data.getEpisode(episodeId);
  if (!ep) return;
  const menu = $('#vt-menu', ui.root);
  const client = Data.getClient(ep.clientId);
  menu.setAttribute('aria-label', `Move ${epName(ep, client)} to`);
  menu.innerHTML = `
    <div class="vt-menu-title" aria-hidden="true">Move ${esc(epName(ep, client))} to</div>
    ${STAGES.map((s) => {
      const current = s.id === ep.stage;
      const disabled = s.id === FINAL_STAGE && !canTickFeedback(ep.stage);
      return `<button type="button" class="vt-menu-item" role="menuitemradio" data-stage="${s.id}" aria-checked="${current}" ${disabled ? 'aria-disabled="true"' : ''} ${disabled ? `title="Approve the episode first"` : ''}>
        <span class="vt-dot" style="--c:${stageColor(s.id)}"></span>${esc(s.label)}
        ${current ? ICONS.check : s.id === FINAL_STAGE ? '<span class="vt-muted">manual tick</span>' : ''}
      </button>`;
    }).join('')}`;
  menu.hidden = false;
  ui.menu = { episodeId, anchor, openedAt: performance.now() };

  // Position near the anchor, clamped to the viewport.
  const r = anchor.getBoundingClientRect();
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let left = Math.min(r.right - mw, window.innerWidth - mw - 8);
  left = Math.max(8, left);
  let top = r.bottom + 6;
  if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 6);
  menu.style.left = `${left}px`; menu.style.top = `${top}px`;
  anchor.setAttribute('aria-expanded', 'true');

  const items = $$('.vt-menu-item', menu);
  (items.find((b) => b.getAttribute('aria-checked') === 'true') || items[0]).focus();
}

function closeMoveMenu() {
  const menu = $('#vt-menu', ui.root);
  if (menu.hidden) return;
  menu.hidden = true; menu.innerHTML = '';
  const anchor = ui.menu && ui.menu.anchor;
  ui.menu = null;
  if (anchor && document.contains(anchor)) { anchor.setAttribute('aria-expanded', 'false'); anchor.focus(); }
}

function bindMoveMenu() {
  const menu = $('#vt-menu', ui.root);
  menu.addEventListener('click', (e) => {
    const item = e.target.closest('.vt-menu-item');
    if (!item || item.getAttribute('aria-disabled') === 'true') return;
    const { episodeId } = ui.menu;
    closeMoveMenu();
    moveEpisode(episodeId, item.dataset.stage);
  });
  menu.addEventListener('keydown', (e) => {
    const items = $$('.vt-menu-item', menu);
    const i = items.indexOf(document.activeElement);
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeMoveMenu(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    else if (e.key === 'Home') { e.preventDefault(); items[0].focus(); }
    else if (e.key === 'End') { e.preventDefault(); items[items.length - 1].focus(); }
    else if (e.key === 'Tab') { closeMoveMenu(); }
  });
  menu.addEventListener('focusout', (e) => { if (ui.menu && !menu.contains(e.relatedTarget) && e.relatedTarget) closeMoveMenu(); });
  document.addEventListener('pointerdown', (e) => { if (ui.menu && !menu.contains(e.target) && !ui.menu.anchor.contains(e.target)) closeMoveMenu(); });
  window.addEventListener('resize', closeMoveMenu);
  // The menu is fixed-position, so scrolling away detaches it from its anchor: close it. Scroll events
  // are dispatched a frame late, so ignore any that belong to the tap/click that just opened it.
  window.addEventListener('scroll', () => { if (ui.menu && performance.now() - ui.menu.openedAt > 300) closeMoveMenu(); }, true);
}

/* =============================================================================
   §11  DIALOGS: new episode, confirm
   ============================================================================= */
function openNewEpisodeDialog() {
  const dlg = $('#vt-new-dialog', ui.root);
  const clients = Data.getClients();
  const preselect = ui.clientFilter !== 'all' && clients.some((c) => c.id === ui.clientFilter) ? ui.clientFilter : (clients[0] && clients[0].id) || '__new';
  const nextNumber = (clientId) => Math.max(0, ...Data.getEpisodes().filter((e) => e.clientId === clientId).map((e) => e.number)) + 1;

  dlg.innerHTML = `
    <form method="dialog" novalidate>
      <div><span class="vt-eyebrow">New episode</span><h2 id="vt-new-title">Add an episode</h2></div>
      <div class="vt-form-grid">
        <label><span class="vt-label">Client</span>
          <span class="vt-field-select"><select class="vt-field" name="clientId" required>
            ${clients.map((c) => `<option value="${esc(c.id)}" ${c.id === preselect ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
            <option value="__new" ${preselect === '__new' ? 'selected' : ''}>+ New client…</option>
          </select>${ICONS.down}</span>
        </label>
        <label><span class="vt-label">Episode number</span>
          <input class="vt-field" type="number" name="number" min="0" step="1" inputmode="numeric" required value="${preselect === '__new' ? 1 : nextNumber(preselect)}">
        </label>
      </div>
      <label data-row="newclient" ${preselect === '__new' ? '' : 'hidden'}><span class="vt-label">New client name</span>
        <input class="vt-field" name="clientName" placeholder="e.g. Camp Fit" maxlength="60" autocomplete="off">
      </label>
      <label><span class="vt-label">Starting stage</span>
        <span class="vt-field-select"><select class="vt-field" name="stage">
          ${STAGES.filter((s) => s.id !== FINAL_STAGE).map((s) => `<option value="${s.id}">${esc(s.label)}</option>`).join('')}
        </select>${ICONS.down}</span>
      </label>
      <label><span class="vt-label">Notes <span class="vt-muted">(optional)</span></span>
        <textarea class="vt-field" name="notes" placeholder="Topic, angle, anything useful" style="min-height:72px"></textarea>
      </label>
      <div class="vt-error" role="alert" data-error></div>
      <div class="vt-dialog-actions">
        <button type="button" class="vt-btn vt-btn-ghost" data-cancel>Cancel</button>
        <button type="submit" class="vt-btn vt-btn-primary">${ICONS.plus}Add episode</button>
      </div>
    </form>`;

  const form = $('form', dlg);
  const clientSel = form.elements.clientId, numberInput = form.elements.number, newRow = $('[data-row="newclient"]', form), err = $('[data-error]', form);
  clientSel.addEventListener('change', () => {
    const isNew = clientSel.value === '__new';
    newRow.hidden = !isNew;
    numberInput.value = isNew ? 1 : nextNumber(clientSel.value);
    if (isNew) form.elements.clientName.focus();
  });
  $('[data-cancel]', form).addEventListener('click', () => dlg.close());
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    err.textContent = '';
    // Validate everything first; only then create a new client, so a failed submit leaves nothing behind.
    const rawNumber = numberInput.value.trim();
    const number = Number(rawNumber);
    if (rawNumber === '' || !numberInput.validity.valid || !Number.isInteger(number) || number < 0) { err.textContent = 'Enter a whole episode number.'; numberInput.focus(); return; }
    let clientId = clientSel.value, newName = '';
    if (clientId === '__new') {
      newName = form.elements.clientName.value.trim();
      if (!newName) { err.textContent = 'Give the new client a name.'; form.elements.clientName.focus(); return; }
      const existing = Data.getClients().find((c) => c.name.toLowerCase() === newName.toLowerCase());
      if (existing && Data.getEpisodes().some((ep) => ep.clientId === existing.id && ep.number === number)) { err.textContent = 'That client already has this episode number.'; numberInput.focus(); return; }
    }
    if (newName) clientId = Data.addClient(newName).id;
    const res = Data.addEpisode({ clientId, number, notes: form.elements.notes.value, stage: form.elements.stage.value });
    if (!res.ok) { err.textContent = res.error + '.'; numberInput.focus(); return; }
    dlg.close();
    const client = Data.getClient(clientId);
    toast(`Added ${epName(res.episode, client)}`, { action: { label: 'Open', onClick: () => openSheet(res.episode.id) } });
  });
  dlg.showModal();
  (preselect === '__new' ? form.elements.clientName : numberInput).focus();
}

function confirmDialog({ title, body, okLabel = 'OK', cancelLabel = 'Cancel', danger = false }) {
  const dlg = $('#vt-confirm', ui.root);
  return new Promise((resolve) => {
    dlg.innerHTML = `
      <div class="vt-dialog-inner">
        <h2 id="vt-confirm-title">${esc(title)}</h2>
        <p>${esc(body)}</p>
        <div class="vt-dialog-actions">
          <button type="button" class="vt-btn vt-btn-ghost" data-cancel>${esc(cancelLabel)}</button>
          <button type="button" class="vt-btn ${danger ? 'vt-btn-danger' : 'vt-btn-primary'}" data-ok>${esc(okLabel)}</button>
        </div>
      </div>`;
    let settled = false;
    const finish = (v) => { if (settled) return; settled = true; resolve(v); if (dlg.open) dlg.close(); };
    $('[data-ok]', dlg).addEventListener('click', () => finish(true));
    $('[data-cancel]', dlg).addEventListener('click', () => finish(false));
    dlg.addEventListener('close', () => finish(false), { once: true });
    dlg.showModal();
    $('[data-cancel]', dlg).focus();
  });
}

/* =============================================================================
   §12  TOASTS
   ============================================================================= */
function toast(message, { action = null, kind = 'info', duration = null } = {}) {
  const host = $('#vt-toasts', ui.root);
  if (!host) return;
  const ttl = duration != null ? duration : (action ? 12000 : 5000);   // toasts with an action stay longer
  while (host.children.length >= 3) {
    const victim = Array.from(host.children).find((c) => !c.contains(document.activeElement)) || host.firstElementChild;
    victim.remove();
  }
  const el = document.createElement('div');
  el.className = `vt-toast vt-glass-strong ${kind === 'warn' ? 'is-warn' : ''}`;
  el.setAttribute('role', 'status');
  el.innerHTML = `<span>${esc(message)}</span>${action ? `<button type="button" class="vt-btn">${esc(action.label)}</button>` : ''}`;
  let timer = null;
  const dismiss = () => {
    clearTimeout(timer);
    if (ui.lastUndo && ui.lastUndo.el === el) ui.lastUndo = null;
    el.classList.add('is-leaving'); setTimeout(() => el.remove(), reducedMotion() ? 0 : 220);
  };
  const arm = () => { clearTimeout(timer); timer = setTimeout(dismiss, ttl); };
  if (action) {
    const run = () => { action.onClick(); dismiss(); };
    $('button', el).addEventListener('click', run);
    if (action.label === 'Undo') ui.lastUndo = { el, run };   // reachable with Cmd/Ctrl+Z
  }
  // Pausing on hover or focus keeps Undo reachable for keyboard users.
  el.addEventListener('mouseenter', () => clearTimeout(timer));
  el.addEventListener('focusin', () => clearTimeout(timer));
  el.addEventListener('mouseleave', arm);
  el.addEventListener('focusout', arm);
  host.appendChild(el);
  arm();
}
function clearToasts() { const host = $('#vt-toasts', ui.root); if (host) host.replaceChildren(); ui.lastUndo = null; }

/* =============================================================================
   §13  THEME
   ============================================================================= */
const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
function effectiveTheme() {
  const t = document.documentElement.dataset.theme;
  return t === 'dark' || t === 'light' ? t : (darkQuery.matches ? 'dark' : 'light');
}
function applyTheme(pref) {
  if (pref === 'dark' || pref === 'light') document.documentElement.dataset.theme = pref;
  else delete document.documentElement.dataset.theme;
  const btn = $('#vt-theme', ui.root);
  if (!btn) return;
  const dark = effectiveTheme() === 'dark';
  btn.innerHTML = dark ? ICONS.sun : ICONS.moon;
  btn.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
  btn.setAttribute('aria-pressed', String(dark));   // the name stays "Dark mode"; the state says whether it is on
}
function toggleTheme() {
  const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
  ui.prefs.theme = next; Store.savePrefs(ui.prefs);
  applyTheme(next);
}

/* =============================================================================
   §14  EXPORT / IMPORT
   ============================================================================= */
function exportData() {
  const payload = Data.exportJSON();
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${CONFIG.exportFilePrefix}-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`Exported ${payload.episodes.length} episodes`);
}
function importDataFromFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onerror = () => toast('Could not read that file', { kind: 'warn' });
  reader.onload = () => {
    let parsed;
    try { parsed = JSON.parse(String(reader.result)); } catch (e) { toast('That file is not valid JSON', { kind: 'warn' }); return; }
    const check = Data.previewImport(parsed);
    if (!check.ok) { toast(check.error, { kind: 'warn' }); return; }
    confirmDialog({
      title: 'Replace current data?',
      body: `The import has ${check.clients} clients and ${check.episodes} episodes${check.skipped ? ` (${check.skipped} skipped as invalid)` : ''}. Everything currently in the tracker will be replaced. Export first if you want a backup.`,
      okLabel: 'Import', danger: true,
    }).then((ok) => {
      if (!ok) return;
      const res = Data.importJSON(parsed);
      if (res.ok) toast(`Imported ${res.episodes} episodes across ${res.clients} clients`);
      else toast(res.error, { kind: 'warn' });
    });
  };
  reader.readAsText(file);
}

/* =============================================================================
   §15  RENDER LOOP + EVENTS + INIT
   ============================================================================= */
function render() {
  const view = $('#vt-view', ui.root);
  const focusKey = captureFocus(view);
  if (ui.view === 'board') renderBoard(view); else renderOverview(view);
  ui.lastRenderedView = ui.view;
  syncToolbar();
  restoreFocus(view, focusKey);
}
function captureFocus(view) {
  const el = document.activeElement;
  if (!el || !view.contains(el)) return null;
  for (const attr of ['data-open', 'data-menu', 'data-action']) if (el.hasAttribute(attr)) return { attr, value: el.getAttribute(attr) };
  return null;
}
function restoreFocus(view, key) {
  if (!key) return;
  const el = view.querySelector(`[${key.attr}="${CSS.escape(key.value)}"]`);
  if (el) el.focus({ preventScroll: true });
}

function setView(name) {
  if (ui.view === name) return;
  ui.view = name;
  render();
  $('#vt-view', ui.root).focus({ preventScroll: true });
}

function onDataChange(evt) {
  if (evt.type === 'db:replace') { ui.clientFilter = 'all'; closeSheet(); clearToasts(); }   // stale Undo must not touch the new data
  renderClientChips();          // counts on the chips change with almost every event
  render();
  if (ui.openEpisodeId && evt.type !== 'episode:meta') {
    if (Data.getEpisode(ui.openEpisodeId)) renderSheet(); else closeSheet();
  }
  if (!Data.storageOk() && !ui.storageWarned) {
    ui.storageWarned = true;
    toast('Storage unavailable: changes will be lost when you close this tab', { kind: 'warn', duration: 8000 });
  }
}

function bindEvents() {
  const root = ui.root;
  const view = $('#vt-view', root);

  // Views
  $('.vt-seg', root).addEventListener('click', (e) => { const b = e.target.closest('[data-view]'); if (b) setView(b.dataset.view); });

  // Toolbar
  let searchTimer = null;
  $('#vt-search', root).addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { ui.search = e.target.value; render(); }, 120);
  });
  $('#vt-client-chips', root).addEventListener('click', (e) => {
    const chip = e.target.closest('[data-client]');
    if (!chip) return;
    ui.clientFilter = chip.dataset.client;
    renderClientChips(); render();
    $(`[data-client="${CSS.escape(ui.clientFilter)}"]`, root)?.focus();
  });
  $('#vt-stage-filter', root).addEventListener('change', (e) => { ui.stageFilter = e.target.value; render(); });
  $('#vt-clear', root).addEventListener('click', () => {
    ui.search = ''; ui.clientFilter = 'all'; ui.stageFilter = 'all';
    $('#vt-search', root).value = ''; $('#vt-stage-filter', root).value = 'all';
    renderClientChips(); render();
    $('#vt-search', root).focus();
  });

  // Header actions
  $('#vt-theme', root).addEventListener('click', toggleTheme);
  $('#vt-new', root).addEventListener('click', openNewEpisodeDialog);
  $('#vt-export', root).addEventListener('click', exportData);
  $('#vt-import', root).addEventListener('click', () => $('#vt-import-file', root).click());
  $('#vt-import-file', root).addEventListener('change', (e) => { importDataFromFile(e.target.files[0]); e.target.value = ''; });

  // Main view: open sheet, card menus, footer actions
  view.addEventListener('click', (e) => {
    const menuBtn = e.target.closest('[data-menu]');
    if (menuBtn) { e.preventDefault(); openMoveMenu(menuBtn.dataset.menu, menuBtn); return; }
    const open = e.target.closest('[data-open]');
    if (open) { openSheet(open.dataset.open); return; }
    const card = e.target.closest('[data-card]');   // the rest of a board card opens the sheet too (mouse convenience)
    if (card && !e.target.closest('button, a')) { openSheet(card.dataset.card); return; }
    const action = e.target.closest('[data-action]');
    if (action && action.dataset.action === 'reset-seed') {
      confirmDialog({ title: 'Reset to sample data?', body: 'This replaces everything in the tracker with the built-in sample clients and episodes.', okLabel: 'Reset', danger: true })
        .then((ok) => { if (ok) { Data.resetToSeed(); toast('Sample data restored'); } });
    }
  });
  bindDragAndDrop(view);
  bindSheet();
  bindMoveMenu();

  // Global keys
  document.addEventListener('keydown', (e) => {
    const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (e.key === 'Escape') {
      if (e.target.closest && e.target.closest('dialog[open]')) return;   // the <dialog> cancels itself
      if (ui.menu) closeMoveMenu(); else if (ui.openEpisodeId) closeSheet();
    }
    if (e.key === '/' && !e.metaKey && !e.ctrlKey && !inField && !ui.menu && !ui.openEpisodeId) {
      e.preventDefault(); $('#vt-search', root).focus();
    }
    if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && !inField && ui.lastUndo) {
      e.preventDefault(); ui.lastUndo.run();
    }
  });
  darkQuery.addEventListener('change', () => applyTheme(ui.prefs.theme));
}

function mount(root) {
  ui.root = root;
  root.classList.add('vt');
  renderShell(root);
  applyTheme(ui.prefs.theme);
  renderClientChips();
  bindEvents();
  Data.onChange(onDataChange);
  try {
    render();
  } catch (err) {
    // Safety net: never leave the owner with a blank page if stored data is somehow unreadable.
    console.error(err);
    $('#vt-view', root).innerHTML = `<section class="vt-glass vt-panel"><div class="vt-empty">Something in the saved data could not be shown.<br><br><button type="button" class="vt-btn" data-action="reset-seed">Reset sample data</button></div></section>`;
  }
  if (!Data.storageOk()) { ui.storageWarned = true; toast('Storage unavailable: changes will be lost when you close this tab', { kind: 'warn', duration: 8000 }); }
}

/* Public surface for the Stan Media hub. */
window.VideoTracker = { mount, Data, STAGES, syncFromSuperClientVideo, openEpisode: openSheet, setView };

mount(document.getElementById('video-tracker'));
})();
</script>
