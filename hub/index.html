<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stan Media Hub</title>
<meta name="description" content="Stan Media — manager and client portals">
<meta name="theme-color" content="#eef0f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06070a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stan Media">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script>try { const t = localStorage.getItem('hub-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="stylesheet" href="hub.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<div id="boot"><div class="spin"></div></div>
<section id="auth" hidden></section>
<div id="app" hidden>
  <header class="top chrome" id="top"></header>
  <main id="view"></main>
  <nav class="tabbar chrome" id="tabbar" aria-label="Sections"></nav>
</div>

<div id="dock" hidden>
  <div class="dock-panel" id="dockPanel" aria-hidden="true">
    <div class="dock-head"><div class="av" id="dockAv"></div><div class="t"><b id="dockName"></b><small id="dockSub"></small></div>
      <button class="ib" data-act="dock" data-v="0" title="Close"></button></div>
    <div class="dock-msgs" id="dockMsgs"></div>
    <div class="dock-drop"><div>Drop a file to send<br><small class="muted">Up to 10 MB</small></div></div>
    <div class="dock-compose">
      <button class="ib" id="dockAttach" title="Attach a file"></button><input type="file" id="dockFile" hidden>
      <textarea id="dockIn" rows="1" placeholder="Message"></textarea>
      <button class="send" id="dockSend" title="Send" disabled></button>
    </div>
  </div>
  <button class="dock-btn chrome" data-act="dock" title="Messages"><span class="ic1"></span><span class="ic2"></span><span class="badge" id="dockBadge" hidden></span></button>
</div>
<div id="toast" class="chrome" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<script src="hub.js"></script>
</body>
</html>
